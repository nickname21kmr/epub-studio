name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EPUBCHECK_VERSION: 5.4.0
      EPUBCHECK_SHA256: 33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Run EPUB core tests
        run: npm test
      - name: Validate generated EPUB structure
        run: python tests/validate_epub.py
      - name: Download EPUBCheck
        run: |
          curl -fsSL -o "$RUNNER_TEMP/epubcheck.zip" \
            "https://github.com/w3c/epubcheck/releases/download/v$EPUBCHECK_VERSION/epubcheck-$EPUBCHECK_VERSION.zip"
          echo "$EPUBCHECK_SHA256  $RUNNER_TEMP/epubcheck.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
      - name: Check samples with EPUBCheck
        run: |
          for epub in sample/*.epub; do
            java -jar "$RUNNER_TEMP/epubcheck-$EPUBCHECK_VERSION/epubcheck.jar" --failonwarnings "$epub"
          done
